[project]
name = "fleetopt"
version = "0.1.0"
description = "Find and prove cost savings in a LangGraph project without editing it"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7",
    # Pinned on purpose. The SDK carries Claude Code inside it, one build per platform, and
    # 0.2.157 and 0.2.160 to 0.2.163 were published without the Windows one (over PyPI's size
    # limit): pip then installs a build with no Claude Code and a run ends "Claude Code not
    # found". Before moving this, check pypi.org/project/claude-agent-sdk/<version>/#files
    # lists win_amd64, both macosx and both manylinux.
    "claude-agent-sdk==0.2.159",
]

# The capture hook runs inside the target's interpreter and imports the target's
# own langchain/langgraph. Deliberately not a dependency here - pinning them
# would risk shadowing the versions the project under test actually uses.
# The `dev` extra: the fixture's langgraph (it has no venv of its own) and the test runner.
[project.optional-dependencies]
dev = [
    "langchain-core==1.6.3",
    "langgraph==1.2.11",
    "pytest>=8",
]

[project.scripts]
fleetopt = "fleetopt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fleetopt*"]

[tool.setuptools.package-data]
"fleetopt.probe" = ["hooks/*.py"]
"fleetopt" = ["GUIDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # targets/ holds other teams' agents, with tests of their own
